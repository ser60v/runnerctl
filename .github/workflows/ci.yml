name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    # The repository variable must name a Runner Platform self-hosted Linux
    # label. An unset variable leaves the job unscheduled; there is no hosted
    # runner fallback.
    runs-on: ${{ vars.RUNNERCTL_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check client and Unix installer
        run: |
          make check
      - name: Build and verify six release archives
        run: |
          sh scripts/package.sh
          (cd .build/release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runnerctl-release
          path: .build/release/*
          if-no-files-found: error
          retention-days: 7
